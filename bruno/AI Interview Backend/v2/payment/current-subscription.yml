info:
  name: Current Subscription
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v2/subscriptions/current"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Fetch current subscription status, plan tier, billing cycle, period dates, and cancellation status for the authenticated user.
