info:
  name: Payment History
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/v2/payments/history?limit=20"
  auth:
    type: bearer
    token: "{{token}}"

params:
  query:
    - name: limit
      value: "20"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Fetch authenticated user's payment history sorted with the most recent transaction first.
