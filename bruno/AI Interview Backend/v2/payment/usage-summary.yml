info:
  name: Usage Summary
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/v2/usage"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Fetch authenticated user's current billing cycle usage vs limits (interviews created vs monthly limit, resumes analyzed vs monthly limit, and feature permissions).
