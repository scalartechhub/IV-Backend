info:
  name: Preview Weekly Report HTML (test@mailinator.com)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v2/admin/weekly-reports/preview/test@mailinator.com?format=html"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000/api

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Renders the complete responsive HTML template of the weekly progress report email for test@mailinator.com for in-browser visual inspection.
