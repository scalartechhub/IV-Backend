info:
  name: Resume Analysis
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/v2/resumes/analyze"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - C:\Users\Scala\Downloads\angular_resume_demo.pdf
        contentType: application/pdf
      - name: targetRole
        type: text
        value: Senior Angular Engineer
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000/api
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body?.data?.resumeId) {
          bru.setEnvVar("v2ResumeId", body.data.resumeId);
        }

settings:
  encodeUrl: true
  timeout: 180000
  followRedirects: true
  maxRedirects: 5

docs: |-
  V2 resume analysis — multipart field: `file` (PDF).

  Optional form fields:
  - `targetRole` — omit for onboarding; ATS/plan infer role from the resume
  - `onboarding` — `true` to generate the interview-prep onboarding plan (write-once)

  Flow:
  1. Extracts text from the PDF and uploads it to Storage (`users/{uid}/resumes/resume.pdf`)
  2. Runs Gemini resume review (scores, strengths, suggestions, sections, keywords, ATS checks, role matches)
  3. Upserts `users/{uid}/onboarding/analysis` (re-analyze overwrites the same doc)

  Response `data` matches the results-page contract: `resumeId`, `analysisId`, `fileName`, `fileType`,
  `storagePath`, `analysisStatus`, `uploadedAt`, `lastAnalyzedAt`, `targetRole`, `experienceLevel`,
  `scores`, `atsFriendly`, `scoreLabels`, `strengths`, `areasToImprove`, `suggestions`, `aiFeedback`,
  `sections`, `keywords`, `ats`, `roleMatches`, `detailedMetrics`, `extractedText` — plus back-compat
  `analysis` (legacy nested shape), `onboardingGenerated`, `onboardingPreserved`.

  No GET endpoint — the frontend reads the saved doc directly via the Firebase Storage/Firestore SDK
  from `users/{uid}/onboarding/analysis`.

  Auto-saves `v2ResumeId`.
  Requires Bearer token — run **Auth > Login** first.
  Update the PDF path (or pick a file in Bruno) before sending.
